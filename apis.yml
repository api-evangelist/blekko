name: Blekko
description: Blekko was a web search engine founded in 2007 by Rich Skrenta, Tom Annau, and Mike Markson
  and launched publicly in 2010. It was best known for "slashtags" — user-applied /slashtag filters that
  curated and narrowed search results by category as a spam-resistant alternative to mainstream search
  engines — and it exposed a developer search API. Blekko was acquired by IBM in March 2015, where its
  technology and team were folded into the IBM Watson group and its consumer search engine was shut down.
  This API Evangelist profile is retained as a historical/defunct record; the company no longer operates
  a live website or public API (blekko.com resolves in DNS but no longer serves HTTPS).
